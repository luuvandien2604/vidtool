[project]
name = "videotool"
version = "0.1.0"
description = "AI Editorial Director - automated documentary video production system"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_media: opt-in tests that hit real provider networks (never in the default suite)",
    "render: opt-in tests that execute ffmpeg to render video (never in the default suite)",
]
addopts = "-m 'not live_media and not render'"
