version: "2.0"
project:
  id: berlin-wall-documentary
  title: "Bức tường Berlin"
  scene_id: scene_03_wall_construction
  language: vi
  aspect_ratio: "16:9"
  resolution: {width: 1920, height: 1080}
  fps: 30
  duration_seconds: 12

scene:
  title: "Đêm Berlin bị phong tỏa"
  historical_date: "1961-08-13"
  narration:
    text: "Sau Thế chiến II, nước Đức bị chia cắt thành Đông Đức (cộng sản) và Tây Đức (tư bản). Hàng triệu người Đông Đức tìm cách vượt biên sang Tây Đức để tìm tự do và cuộc sống tốt đẹp hơn.\n\nĐể ngăn làn sóng tháo chạy, chính quyền Đông Đức quyết định dựng lên một bức tường ngăn cách Berlin."
    start: 0.5
    end: 11.2

style:
  visual_language: historical_editorial_documentary
  palette:
    paper: "#E7E0D2"
    charcoal: "#161616"
    yellow: "#E1B400"
    red: "#8C3932"
    blue: "#33495A"
  effects: [film_grain, paper_texture, dust, ink_splatter, vignette]

license_policy:
  important: "Ảnh Bundesarchiv bên dưới dùng CC BY-SA 3.0 DE khi được ghi rõ. Giữ attribution, link license, ghi rõ thay đổi khi có và kiểm tra nghĩa vụ ShareAlike trước khi phân phối bản remix."
